services:
  postgres:
    image: postgres:16-alpine
    container_name: student-carlift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carlift_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carlift_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
